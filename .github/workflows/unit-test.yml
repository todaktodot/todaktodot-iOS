name: Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache mise tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/mise
          key: ${{ runner.os }}-mise-${{ hashFiles('.mise.toml') }}

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install Tools via mise
        run: mise install

      - name: Install dependencies
        run: mise exec -- tuist install

      - name: Create xcconfig files
        run: |
          mkdir -p Projects/todaktodot/Config
          printf "KAKAO_APP_KEY = dummy\nKAKAO_URL_KEY = dummy\nGOOGLE_URL_KEY = dummy\nTODAKTODOT_API = dummy\nTODAKTODOT_DEV_API = dummy\nDISCORD_WEBHOOK_URL = dummy\nPRODUCT_BUNDLE_IDENTIFIER = com.todaktodot.test\nAPP_DISPLAY_NAME = todaktodot\nASSETCATALOG_COMPILER_APPICON_NAME = AppIcon\n" > Projects/todaktodot/Config/Debug.xcconfig
          cp Projects/todaktodot/Config/Debug.xcconfig Projects/todaktodot/Config/Release.xcconfig

      - name: Generate project
        run: mise exec -- tuist generate --no-open

      - name: Run NetworkKit Tests
        run: |
          xcodebuild test \
            -workspace todaktodotWorkspace.xcworkspace \
            -scheme NetworkKit \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults/NetworkKit.xcresult \
            | xcpretty --color || true

      - name: Run todaktodot Tests
        run: |
          xcodebuild test \
            -workspace todaktodotWorkspace.xcworkspace \
            -scheme todaktodot \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults/todaktodot.xcresult \
            | xcpretty --color

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 7
