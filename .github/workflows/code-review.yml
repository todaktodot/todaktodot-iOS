name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          # base 브랜치와 현재 HEAD 사이의 차이점 추출
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Gemini Code Review
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Diff 데이터를 환경 변수로 안전하게 넘김
          PR_DIFF: ${{ steps.diff.outputs.diff }}
        with:
          script: |
            const diff = process.env.PR_DIFF;
            
            if (!diff || diff.trim() === '') {
              console.log('리뷰할 변경 사항이 없습니다.');
              return;
            }
            
            // 2.5-flash 모델 사용 시 엔드포인트 확인
            const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + process.env.GEMINI_API_KEY;
            
            const prompt = `당신은 10년 차 이상의 숙련된 시니어 소프트웨어 엔지니어입니다. 코드 변경 사항을 리뷰할 때, 스타일 수정 및 런타임 에러, 보안 취약점, 비효율적인 알고리즘, 기존 시스템과의 호환성 파괴(Breaking Changes) 등 치명적인 이슈를 찾는 데 집중하십시오. 모든 피드백은 반드시 한국어로 작성하며, 단순히 무엇이 잘못되었는지 지적하는 것을 넘어 구체적인 수정 코드 예시와 기술적 근거를 포함하여 즉시 적용 가능한(Actionable) 형태로 제공해야 합니다. 답변의 가독성을 중요하게 여기며, 각 항목은 [위치 및 분류], [수정 제안], [근거 및 이유]의 구조를 가진 불렛 포인트로 간결하게 구성하십시오. 만약 코드에 결함이 없고 품질이 우수하다면 군더더기 없이 LGTM 👍`;

            try {
              const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{
                    parts: [{ text: prompt + "\n\nDiff:\n" + diff }]
                  }]
                })
              });
              
              const data = await response.json();
              
              // API 응답 에러 핸들링
              if (data.error) {
                throw new Error(`API Error: ${data.error.message}`);
              }
              
              if (!data.candidates || !data.candidates[0].content) {
                throw new Error('응답 데이터 구조가 올바르지 않습니다.');
              }
              
              const review = data.candidates[0].content.parts[0].text;
              
              // PR에 댓글 달기
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 🤖 코드 리뷰\n\n${review}`
              });
            } catch (error) {
              console.error('리뷰 생성 중 오류 발생:', error);
            }
