name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Gemini Code Review
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const diff = `${{ steps.diff.outputs.diff }}`;
            
            if (!diff || diff.trim() === '') {
              console.log('No changes to review');
              return;
            }
            
            const prompt = 'You are a senior code reviewer. Review this code change and provide ONLY actionable feedback.\n\nFocus on:\n- Critical bugs or logic errors\n- Security vulnerabilities\n- Performance issues\n- Breaking changes\n\nSkip:\n- Minor style issues\n- Formatting (unless critical)\n- Obvious improvements\n\nFormat:\n- Use bullet points\n- Be specific and concise\n- Include code examples for fixes\n- If no issues: just say "LGTM 👍"\n\nRespond in Korean.\n\nDiff:\n';
            
            const response = await fetch('https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=' + process.env.GEMINI_API_KEY, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{
                  parts: [{
                    text: prompt + diff
                  }]
                }]
              })
            });
            
            const data = await response.json();
            console.log('Gemini API Response:', JSON.stringify(data, null, 2));
            
            if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
              throw new Error('Invalid API response: ' + JSON.stringify(data));
            }
            
            const review = data.candidates[0].content.parts[0].text;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 AI Code Review\n\n${review}`
            });
